name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: almalinux-9

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build distribution
        run: ./gradlew installDist fatJar

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/flexo-cli-client-*.jar
            build/install/flexo/bin/flexo
            build/install/flexo/bin/flexo.bat
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}