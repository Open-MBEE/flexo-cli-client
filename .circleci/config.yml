version: 2.1

executors:
  java-executor:
    docker:
      - image: cimg/java:17.0
    working_directory: ~/project

workflows:
  version: 2
  build-and-test:
    jobs:
      - build
      - dependency-check:
          requires:
            - build
      - build-dist:
          requires:
            - build

  release:
    jobs:
      - release:
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/

jobs:
  build:
    executor: java-executor
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.14
      - run:
          name: Login to Dockerhub
          command: |
            if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
              echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
            else
              echo "DOCKER_USERNAME or DOCKER_PASSWORD not set, using CircleCI credentials"
            fi
      - restore_cache:
          keys:
            - v1-gradle-{{ checksum "build.gradle" }}
            - v1-gradle-
      - run:
          name: Build
          command: ./gradlew build
      - run:
          name: Run Tests
          command: ./gradlew test
      - save_cache:
          key: v1-gradle-{{ checksum "build.gradle" }}
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
      - store_test_results:
          path: build/test-results/
      - store_artifacts:
          path: build/
          destination: build

  dependency-check:
    executor: java-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gradle-deps-{{ checksum "build.gradle" }}
            - v1-gradle-deps-
      - run:
          name: Run OWASP Dependency Check
          command: ./gradlew dependencyCheckAnalyze
      - save_cache:
          key: v1-gradle-deps-{{ checksum "build.gradle" }}
          paths:
            - ~/.gradle/caches
      - store_artifacts:
          path: build/reports/dependency-check-report.html
          destination: security-report

  build-dist:
    executor: java-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gradle-dist-{{ checksum "build.gradle" }}
            - v1-gradle-dist-
      - run:
          name: Build Distribution
          command: ./gradlew installDist
      - save_cache:
          key: v1-gradle-dist-{{ checksum "build.gradle" }}
          paths:
            - ~/.gradle/caches
      - store_artifacts:
          path: build/install/
          destination: distribution

  release:
    executor: java-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-gradle-release-{{ checksum "build.gradle" }}
            - v1-gradle-release-
      - run:
          name: Build Distribution
          command: ./gradlew installDist fatJar
      - save_cache:
          key: v1-gradle-release-{{ checksum "build.gradle" }}
          paths:
            - ~/.gradle/caches
      - run:
          name: Create GitHub Release
          command: |
            if [ -n "$GITHUB_TOKEN" ]; then
              curl -L https://github.com/softprops/action-gh-release/releases/latest/download/action-gh-release-linux-linux-amd64.tar.gz | tar -xz
              ./dist/release
              mv build/libs/*.jar .
              mv build/install/flexo/bin/flexo .
              mv build/install/flexo/bin/flexo.bat .
              ./action-gh-release --files "*.jar,flexo,flexo.bat" --generate-release-notes
            fi
          environment:
            GITHUB_TOKEN: ${GITHUB_TOKEN}