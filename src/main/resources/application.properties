# Flexo CLI Client Default Configuration
# Users can override these in ~/.flexo/config

# Local MMS URL (default: http://localhost:8080)
# mms.url=http://localhost:8080

# Default context (optional)
# default.remote=origin
# default.org=
# default.repo=
# default.branch=master

# RDF format (default: turtle)
# rdf.format=turtle

# Logging level (default: INFO)
# logging.level=INFO

# Remote configuration (optional - for pull/push with remote servers)
# remote.origin.url=https://mms.example.com
# remote.origin.auth.enabled=false
# remote.origin.auth.sshKeyPath=~/.ssh/id_rsa
# remote.origin.auth.localMode=false
# remote.origin.auth.localUser=root
# remote.origin.auth.localJwtSecret=your-secret-here
