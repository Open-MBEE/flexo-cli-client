# Flexo CLI Client Default Configuration
# Users can override these in ~/.flexo/config

# MMS Layer 1 Service URL
mms.url=http://localhost:8080

# Authentication settings
auth.enabled=false
auth.sshKeyPath=~/.ssh/id_rsa

# Local development mode - uses hardcoded "root" user with simple JWT
# Enable this when connecting to locally deployed flexo-mms-layer1-service without proper auth
# WARNING: You MUST set local.jwtSecret in ~/.flexo/config when using local.mode=true
# NEVER use a weak or default secret in production environments
local.mode=false
local.user=root
local.jwtSecret=

# Default context
default.org=
default.repo=
default.branch=master

# RDF format (turtle, jsonld, rdfxml, ntriples)
rdf.format=turtle

# Logging level (ERROR, WARN, INFO, DEBUG, TRACE)
logging.level=INFO
